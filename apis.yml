apis:
  - aid: mercado-pago:payments
    name: Mercado Pago Payments API
    description: >-
      Core REST API for creating and managing payments across cards, account
      money, bank transfer (PIX in Brazil, SPEI in Mexico, PSE in Colombia),
      boleto, OXXO cash, and other LATAM local methods. Supports authorisation,
      capture, refund, partial refund, cancellation, and status retrieval.
    humanURL: https://www.mercadopago.com.br/developers/en/reference/payments/_payments/post
    baseURL: https://api.mercadopago.com
    tags:
      - Payments
      - Cards
      - PIX
      - Refunds
      - Captures
    properties:
      - type: Documentation
        url: https://www.mercadopago.com.br/developers/en/reference/payments/_payments/post
      - type: APIReference
        url: https://www.mercadopago.com.br/developers/en/reference
      - type: OpenAPI
        url: https://raw.githubusercontent.com/api-evangelist/mercado-pago/refs/heads/main/openapi/mercado-pago-openapi.yml
  - aid: mercado-pago:checkout-pro
    name: Mercado Pago Checkout Pro
    description: >-
      Hosted, pre-configured checkout experience. Merchants create a preference
      via API, then redirect the buyer to a Mercado Pago hosted page that
      handles UI, payment-method selection, 3DS, and returns to a callback URL
      on completion. Lowest PCI scope and fastest time-to-market.
    humanURL: https://www.mercadopago.com.br/developers/en/docs/checkout-pro/landing
    baseURL: https://api.mercadopago.com
    tags:
      - Checkout
      - Hosted
      - Preferences
    properties:
      - type: Documentation
        url: https://www.mercadopago.com.br/developers/en/docs/checkout-pro/landing
  - aid: mercado-pago:checkout-bricks
    name: Mercado Pago Checkout Bricks
    description: >-
      Composable web components ("bricks") merchants embed in their own UI —
      card form, wallet, payment-method picker, status screen, security code.
      Lets merchants assemble a branded checkout while Mercado Pago handles PCI
      scope and tokenisation.
    humanURL: https://www.mercadopago.com.br/developers/en/docs/checkout-bricks/landing
    baseURL: https://api.mercadopago.com
    tags:
      - Checkout
      - Web Components
      - Bricks
      - Tokenization
    properties:
      - type: Documentation
        url: https://www.mercadopago.com.br/developers/en/docs/checkout-bricks/landing
  - aid: mercado-pago:checkout-api
    name: Mercado Pago Checkout API
    description: >-
      Full server-side checkout control. Tokenise cards client-side, create a
      payment server-side, manage 3DS challenges, handle capture, refund, and
      installments — all without redirecting the buyer.
    humanURL: https://www.mercadopago.com.br/developers/en/docs/checkout-api/landing
    baseURL: https://api.mercadopago.com
    tags:
      - Checkout
      - Card Payments
      - 3DS
      - Installments
    properties:
      - type: Documentation
        url: https://www.mercadopago.com.br/developers/en/docs/checkout-api/landing
  - aid: mercado-pago:orders
    name: Mercado Pago Orders API
    description: >-
      Next-generation unified Orders API consolidating payments, captures,
      refunds, and transactions under a single resource. Supports multi-method
      orders, partial captures, partial refunds, and async processing.
    humanURL: https://www.mercadopago.com.br/developers/en/reference/order/online-payments/create/post
    baseURL: https://api.mercadopago.com
