aid: mercado-pago
name: Mercado Pago
description: >-
  Mercado Pago is the payments and financial-services arm of Mercado Libre,
  Latin America's largest e-commerce and fintech platform. Founded in 2003,
  it processes a substantial share of LatAm digital payments across Brazil
  (PIX, Boleto, cards), Argentina, Mexico (SPEI, OXXO), Chile, Colombia, Peru,
  and Uruguay, with consumer wallet, merchant acquiring, card issuing, lending,
  and crypto products layered on top. The developer portal at
  developers.mercadopago.com exposes a deep payments stack — Checkout Pro
  (hosted), Checkout Bricks (composable web components), Checkout API (full
  server-side control), Orders API (next-gen checkout), Subscriptions, Payment
  Links, Point (in-person card readers), and QR payments — backed by REST APIs
  and official SDKs in Node.js / TypeScript, Python, PHP, Ruby, Java, .NET, Go,
  iOS, and Android, plus a CLI, an MCP server for AI agents, e-commerce plugins
  (WooCommerce, VTEX, Tiendanube, Shopify), and an n8n integration. Regional
  developer portals (.com.ar, .com.br, .com.mx, .com.cl, .com.co, .com.pe,
  .com.uy) localise docs and pricing per LATAM market.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
access: 3rd-Party
