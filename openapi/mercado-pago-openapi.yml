openapi: 3.1.0
info:
  title: Mercado Pago REST API
  description: |
    Mercado Pago REST API covering payments, Checkout Pro preferences,
    subscriptions (preapprovals), customers, cards, merchant orders, Orders
    API, refunds, chargebacks, claims, reports, Point (POS), QR, and OAuth.
    All requests authenticate with a Bearer access token in the
    `Authorization` header. Webhook deliveries are signed via the
    `x-signature` and `x-request-id` headers.
  version: "v1"
  contact:
    name: Mercado Pago Developers
    url: https://www.mercadopago.com.br/developers/en/reference
  license:
    name: Mercado Pago Terms of Service
    url: https://www.mercadopago.com.br/ayuda/terminos-y-politicas_299
servers:
  - url: https://api.mercadopago.com
    description: Mercado Pago Production API
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: OAuth 2.0 authorisation flows
  - name: Payments
    description: Create, capture, refund, and search payments
  - name: Preferences
    description: Checkout Pro preferences
  - name: Orders
    description: Unified Orders API (next-generation checkout)
  - name: Subscriptions
    description: Recurring preapproval subscriptions
  - name: Plans
    description: Subscription plans
  - name: Customers
    description: Stored customers and addresses
  - name: Cards
    description: Tokenised customer cards
  - name: Merchant Orders
    description: Aggregated preference + payments order resource
  - name: Payment Methods
    description: Discover available payment methods
  - name: Refunds
    description: Refund payments
  - name: Chargebacks
    description: Read chargebacks and disputes
  - name: Claims
    description: Buyer claims, mediations, and evidence
  - name: Reports
    description: Settlement and release reports
  - name: Point
    description: In-person POS (stores, terminals)
  - name: QR
    description: QR-code in-person collection
paths:
  /oauth/token:
    post:
      tags: [Authentication]
      summary: Create Or Refresh An OAuth Token
      operationId: createOauthToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        "200":
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'

  /v1/payments:
    post:
      tags: [Payments]
      summary: Create A Payment
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /v1/payments/search:
    get:
      tags: [Payments]
      summary: Search Payments
      operationId: searchPayments
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: external_reference
          in: query
          schema: { type: string }
        - name: range
          in: query
          schema: { type: string, enum: [date_created, date_approved, date_last_updated] }
        - name: begin_date
          in: query
          schema: { type: string, format: date-time }
        - name: end_date
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 30, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSearchResults'

  /v1/payments/{id}:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    get:
      tags: [Payments]
      summary: Get A Payment
      operationId: getPayment
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
    put:
      tags: [Payments]
      summary: Update A Payment
      description: Capture, cancel, or update payment metadata.
      operationId: updatePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentUpdateRequest'
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /v1/payments/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    put:
      tags: [Payments]
      summary: Cancel A Payment
      operationId: cancelPayment
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /v1/payments/{id}/refunds:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    post:
      tags: [Refunds]
      summary: Refund A Payment
      operationId: refundPayment
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
    get:
      tags: [Refunds]
      summary: List Refunds For A Payment
      operationId: listRefunds
      responses:
        "200":
          description: Refunds list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Refund'

  /v1/payments/{id}/refunds/{refund_id}:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
      - name: refund_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Refunds]
      summary: Get A Refund
      operationId: getRefund
      responses:
        "200":
          description: Refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'

  /v1/payment_methods:
    get:
