components:
  parameters:
    PaymentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1234567890

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: access_token
      description: |
        Mercado Pago access token. Send as `Authorization: Bearer {ACCESS_TOKEN}`.
        HTTPS is required. Idempotency is supported via the `X-Idempotency-Key`
        header on POST/PUT operations.
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.mercadopago.com/authorization
          tokenUrl: https://api.mercadopago.com/oauth/token
          scopes:
            offline_access: Persistent refresh token
            read: Read merchant data
            write: Write merchant data

  schemas:
    OAuthTokenRequest:
      type: object
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token, client_credentials]
        client_id: { type: string }
        client_secret: { type: string }
        code: { type: string }
        refresh_token: { type: string }
        redirect_uri: { type: string, format: uri }

    OAuthTokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer }
        scope: { type: string }
        user_id: { type: integer }
        refresh_token: { type: string }
        public_key: { type: string }
        live_mode: { type: boolean }

    Payment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        date_created: { type: string, format: date-time }
        date_approved: { type: string, format: date-time, nullable: true }
        date_last_updated: { type: string, format: date-time }
        money_release_date: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [pending, approved, authorized, in_process, in_mediation, rejected, cancelled, refunded, charged_back]
        status_detail: { type: string }
        currency_id: { type: string, example: BRL }
        description: { type: string }
        transaction_amount: { type: number, format: double }
        transaction_amount_refunded: { type: number, format: double }
        payment_method_id: { type: string, example: pix }
        payment_type_id:
          type: string
          enum: [credit_card, debit_card, ticket, bank_transfer, atm, account_money, digital_currency, digital_wallet, prepaid_card]
        installments: { type: integer }
        external_reference: { type: string }
        payer:
          $ref: '#/components/schemas/Payer'
        metadata:
          type: object
          additionalProperties: true

    PaymentCreateRequest:
      type: object
      required: [transaction_amount, payment_method_id, payer]
      properties:
        transaction_amount: { type: number, format: double }
        token: { type: string }
        description: { type: string }
        installments: { type: integer, minimum: 1, default: 1 }
        payment_method_id: { type: string, example: visa }
        issuer_id: { type: string }
        external_reference: { type: string }
        statement_descriptor: { type: string }
        notification_url: { type: string, format: uri }
        capture: { type: boolean, default: true }
        binary_mode: { type: boolean, default: false }
        payer:
          $ref: '#/components/schemas/Payer'
        metadata:
          type: object
          additionalProperties: true

    PaymentUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum: [cancelled]
        capture: { type: boolean }
        transaction_amount: { type: number, format: double }

    PaymentSearchResults:
      type: object
      properties:
        paging:
          type: object
          properties:
            total: { type: integer }
            limit: { type: integer }
            offset: { type: integer }
        results:
          type: array
          items:
            $ref: '#/components/schemas/Payment'

    Payer:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [customer, guest, registered] }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        identification:
          type: object
          properties:
            type: { type: string, example: CPF }
            number: { type: string }

    Refund:
      type: object
      properties:
        id: { type: integer, format: int64 }
        payment_id: { type: integer, format: int64 }
        amount: { type: number, format: double }
        source:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            type: { type: string }
        date_created: { type: string, format: date-time }
        status: { type: string, enum: [approved, rejected, in_process] }
        unique_sequence_number: { type: string, nullable: true }

    RefundRequest:
      type: object
      properties:
        amount:
          type: number
          format: double
          description: Optional partial refund amount. Omit for a full refund.

    PaymentMethod:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        payment_type_id: { type: string }
        status: { type: string }
        secure_thumbnail: { type: string, format: uri }
        thumbnail: { type: string, format: uri }
        deferred_capture: { type: string }
        settings:
          type: array
          items:
            type: object

    IdentificationType:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        min_length: { type: integer }
        max_length: { type: integer }

    Preference:
      type: object
      properties:
        id: { type: string }
        client_id: { type: string }
        collector_id: { type: integer }
        date_created: { type: string, format: date-time }
        external_reference: { type: string }
        init_point: { type: string, format: uri }
        sandbox_init_point: { type: string, format: uri }
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreferenceItem'
        payer:
          $ref: '#/components/schemas/Payer'
        back_urls:
          type: object
          properties:
            success: { type: string, format: uri }
            pending: { type: string, format: uri }
            failure: { type: string, format: uri }
        auto_return: { type: string, enum: [approved, all] }
        notification_url: { type: string, format: uri }

    PreferenceRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreferenceItem'
        payer:
          $ref: '#/components/schemas/Payer'
        back_urls:
          type: object
          properties:
            success: { type: string, format: uri }
            pending: { type: string, format: uri }
            failure: { type: string, format: uri }
        auto_return: { type: string, enum: [approved, all] }
        notification_url: { type: string, format: uri }
        external_reference: { type: string }
        expires: { type: boolean }
        expiration_date_from: { type: string, format: date-time }
        expiration_date_to: { type: string, format: date-time }

    PreferenceItem:
      type: object
      required: [title, quantity, unit_price]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        picture_url: { type: string, format: uri }
        category_id: { type: string }
        quantity: { type: integer, minimum: 1 }
        currency_id: { type: string, example: BRL }
        unit_price: { type: number, format: double }

    Order:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [online, point] }
        external_reference: { type: string }
        total_amount: { type: string }
        status:
          type: string
          enum: [created, processed, partially_processed, action_required, cancelled, refunded]
        status_detail: { type: string }
        capture_mode: { type: string, enum: [automatic, manual] }
        transactions:
          type: object
          properties:
            payments:
              type: array
              items:
                type: object

    OrderRequest:
      type: object
      required: [type, total_amount, external_reference]
      properties:
        type: { type: string, enum: [online, point] }
        external_reference: { type: string }
        total_amount: { type: string }
        capture_mode: { type: string, enum: [automatic, manual], default: automatic }
        processing_mode: { type: string, enum: [automatic, manual], default: automatic }
        payer:
          $ref: '#/components/schemas/Payer'
        transactions:
          type: object
          additionalProperties: true

    Subscription:
      type: object
      properties:
        id: { type: string }
        payer_id: { type: integer }
        payer_email: { type: string, format: email }
        back_url: { type: string, format: uri }
        reason: { type: string }
        external_reference: { type: string }
        status:
          type: string
          enum: [pending, authorized, paused, cancelled, finished]
        date_created: { type: string, format: date-time }
        last_modified: { type: string, format: date-time }
        next_payment_date: { type: string, format: date-time }
        auto_recurring:
          $ref: '#/components/schemas/AutoRecurring'

    SubscriptionRequest:
      type: object
      required: [reason, auto_recurring, payer_email]
      properties:
        preapproval_plan_id: { type: string }
        reason: { type: string }
        external_reference: { type: string }
        payer_email: { type: string, format: email }
        card_token_id: { type: string }
        back_url: { type: string, format: uri }
        status: { type: string, enum: [authorized, pending] }
        auto_recurring:
          $ref: '#/components/schemas/AutoRecurring'

    AutoRecurring:
      type: object
      properties:
        frequency: { type: integer }
        frequency_type: { type: string, enum: [days, months] }
        start_date: { type: string, format: date-time }
        end_date: { type: string, format: date-time }
        transaction_amount: { type: number, format: double }
        currency_id: { type: string, example: BRL }
        free_trial:
          type: object
          properties:
            frequency: { type: integer }
            frequency_type: { type: string }

    Customer:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        identification:
          type: object
          properties:
            type: { type: string }
            number: { type: string }
        phone:
          type: object
          properties:
            area_code: { type: string }
            number: { type: string }
        date_registered: { type: string, format: date-time }
        date_last_updated: { type: string, format: date-time }
        live_mode: { type: boolean }

    CustomerRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        phone:
          type: object
          properties:
            area_code: { type: string }
            number: { type: string }
        identification:
          type: object
          properties:
            type: { type: string }
            number: { type: string }
        description: { type: string }

    Card:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        expiration_month: { type: integer }
        expiration_year: { type: integer }
        first_six_digits: { type: string }
        last_four_digits: { type: string }
        payment_method:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        security_code:
          type: object
          properties:
            length: { type: integer }
            card_location: { type: string }
        issuer:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        cardholder:
          type: object
          properties:
            name: { type: string }
            identification:
              type: object
              properties:
                type: { type: string }
                number: { type: string }
        date_created: { type: string, format: date-time }
        date_last_updated: { type: string, format: date-time }

    MerchantOrder:
      type: object
      properties:
        id: { type: integer, format: int64 }
        preference_id: { type: string }
        external_reference: { type: string }
        site_id: { type: string }
        status: { type: string, enum: [opened, closed, expired] }
        order_status:
          type: string
          enum: [payment_required, payment_in_process, paid, partially_paid, partially_refunded, refunded, expired]
        total_amount: { type: number, format: double }
        paid_amount: { type: number, format: double }
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreferenceItem'
        payments:
          type: array
          items:
            type: object

    Chargeback:
      type: object
      properties:
        id: { type: integer, format: int64 }
        payments: { type: array, items: { type: integer } }
        date_created: { type: string, format: date-time }
        date_last_updated: { type: string, format: date-time }
        currency_id: { type: string }
        amount: { type: number, format: double }
        status:
          type: string
          enum: [pending, in_mediation, won, lost, refunded, expired]
        reason: { type: string }
        liable_party:
          type: string
          enum: [collector, mercadopago, insurance]
