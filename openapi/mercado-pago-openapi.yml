  /v1/orders:
    post:
      tags: [Orders]
      summary: Create An Order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /v1/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Orders]
      summary: Get An Order
      operationId: getOrder
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /v1/orders/{id}/capture:
    parameters:
      - name: id
        in: path
