name: mercado-pago-checkout
description: |
  Shared Mercado Pago Checkout capability covering Checkout Pro preferences
  and the unified Orders API. Lets an agent create, retrieve, search,
  capture, cancel, and refund a hosted or orders-based checkout flow.
provider: mercado-pago
api: mercado-pago:checkout-pro
openapi: ../../openapi/mercado-pago-openapi.yml
auth:
  type: bearer
  env: MERCADO_PAGO_ACCESS_TOKEN
operations:
  - operationId: createPreference
  - operationId: getPreference
  - operationId: updatePreference
  - operationId: searchPreferences
  - operationId: createOrder
  - operationId: getOrder
  - operationId: captureOrder
  - operationId: cancelOrder
  - operationId: refundOrder
  - operationId: addOrderTransaction
tags:
  - Checkout
  - Preferences
  - Orders
