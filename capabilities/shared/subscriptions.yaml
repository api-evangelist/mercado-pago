name: mercado-pago-subscriptions
description: |
  Shared Mercado Pago Subscriptions capability for managing preapproval
  subscriptions and subscription plans (recurring billing).
provider: mercado-pago
api: mercado-pago:subscriptions
openapi: ../../openapi/mercado-pago-openapi.yml
auth:
  type: bearer
  env: MERCADO_PAGO_ACCESS_TOKEN
operations:
  - operationId: createSubscription
  - operationId: getSubscription
  - operationId: updateSubscription
  - operationId: searchSubscriptions
  - operationId: createPlan
  - operationId: getPlan
  - operationId: updatePlan
  - operationId: searchPlans
tags:
  - Subscriptions
  - Recurring
  - Plans
