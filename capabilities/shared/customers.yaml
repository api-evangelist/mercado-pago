name: mercado-pago-customers
description: |
  Shared Mercado Pago Customers and Cards capability. Manage stored buyers
  and their tokenised payment instruments for one-click and recurring
  payments.
provider: mercado-pago
api: mercado-pago:customers-cards
openapi: ../../openapi/mercado-pago-openapi.yml
auth:
  type: bearer
  env: MERCADO_PAGO_ACCESS_TOKEN
operations:
  - operationId: createCustomer
  - operationId: getCustomer
  - operationId: updateCustomer
  - operationId: searchCustomers
  - operationId: saveCustomerCard
  - operationId: listCustomerCards
  - operationId: getCustomerCard
  - operationId: deleteCustomerCard
tags:
  - Customers
  - Cards
  - Vault
