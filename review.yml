aid: mercado-pago
name: Mercado Pago
reviewed: '2026-05-25'
reviewer: Kin Lane
tier: 1
type: company
summary: >-
  Mercado Pago is a tier-1 Latin American fintech and the payments arm of
  Mercado Libre. Its developer surface is mature and broad: a comprehensive
  REST API covering payments (cards, PIX, boleto, OXXO, SPEI, PSE, account
  money), Checkout Pro / Bricks / API, the new unified Orders API,
  preapproval Subscriptions, Payment Links, customers and tokenised cards,
  Point (POS) and QR for in-person, chargebacks, claims, and settlement
  reports. Backed by official SDKs across nine languages (Node, Python,
  PHP, Ruby, Java, .NET, Go, iOS, Android), a Mercado Pago CLI distributed
  via Homebrew, a Model Context Protocol server for agent-driven payments,
  an n8n node, and merchant plugins for WooCommerce, VTEX, Tiendanube,
  PrestaShop, Salesforce, Wix, and Magento. Webhook deliveries are signed.
  Regional portals localise docs and pricing across Brazil, Argentina,
  Mexico, Chile, Colombia, Peru, and Uruguay.

strengths:
  - Deep REST API surface across pay-in, checkout, subscriptions, POS, QR, and post-sale
  - Comprehensive multi-language SDK fleet (9 official languages)
  - Mercado Pago CLI for sandbox / event triggering
  - Official MCP server enabling agent-driven payment workflows
  - Signed webhook delivery (x-signature + x-request-id)
  - Strong LATAM payment-method coverage (PIX, Boleto, OXXO, SPEI, PSE)
  - Regional developer portals per market with localised docs and pricing
  - First-party e-commerce plugins for WooCommerce, VTEX, Tiendanube
  - Discord developer community and dedicated status page
  - Unified Orders API consolidates payments + transactions + captures + refunds
  - Sandbox environment with first-class test fixtures (test_user)

gaps:
  - No public, downloadable OpenAPI/Swagger artifact at the provider portal
  - No published numeric rate-limit policy (limits are per-token, operationally observed)
  - Pricing is market- and contract-specific; no single global rate card
  - Marketplace OAuth model is documented but less polished than Stripe Connect equivalents
  - SDK release cadence varies by language (Node/Python lead; Ruby/Go/iOS lag)
  - Reports API is functional but export-only — no streaming reconciliation

